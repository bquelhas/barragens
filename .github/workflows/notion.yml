name: Dados Notion (diário)

# Atualiza apenas `data/notion.json` (links para as páginas do Notion),
# independentemente da extração OSM. Corre uma vez por dia (05:37 UTC) e
# também à mão. Se editares o Notion e quiseres ver já, usa "Run workflow".
#
# Nota: as capas carregadas NO Notion expiram (~1 h); correr mais vezes não
# resolve isso — o estável é usar URLs externas para as fotos.
#
# Segredos necessários (Settings -> Secrets and variables -> Actions):
#   NOTION_TOKEN         token da integração do Notion
#   NOTION_DATABASE_ID   id da base de dados de barragens
# Se não existirem, o script termina sem erro e o site fica sem links.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: dados-notion
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para poder disparar o workflow de publicação

jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python scripts/fetch_notion.py

      - name: Commit e push do notion.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notion.json
          if git diff --cached --quiet; then
            echo "Sem alterações no notion.json."
          else
            git commit -m "dados: atualização Notion $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi

      # O push com o GITHUB_TOKEN não dispara outros workflows; disparamos o Pages.
      - name: Publicar no GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
