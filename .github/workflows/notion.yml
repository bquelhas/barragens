name: Dados Notion (manual)

# Atualiza apenas `data/notion.json` (links para as páginas do Notion) e as
# camadas `submersos`/`bairros` (base Lost Cities - BD).
#
# Corre SÓ quando é lançado à mão (separador "Actions" -> "Run workflow").
# Não tem agendamento.
#
# Nota: as fotos carregadas NO Notion (Files & Media) expiram (~1 h); correr
# mais vezes não resolve isso — o estável é usar URLs externas.
#
# Segredos necessários (Settings -> Secrets and variables -> Actions):
#   NOTION_TOKEN         token da integração do Notion
#   NOTION_DATABASE_ID   id da base de dados
# Se não existirem, o script termina sem erro e o site fica sem links.

on:
  workflow_dispatch:

concurrency:
  group: dados-notion
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para poder disparar o workflow de publicação

jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python scripts/fetch_notion.py
          python scripts/fetch_lost_cities.py

      - name: Commit e push dos dados do Notion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notion.json data/manifest.json \
                  data/submersos_notion.geojson data/bairros_notion.geojson \
                  scripts/geocode_cache.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados do Notion."
          else
            git commit -m "dados: atualização Notion $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi

      # O push com o GITHUB_TOKEN não dispara outros workflows; disparamos o Pages.
      - name: Publicar no GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
